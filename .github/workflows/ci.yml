name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python }}"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install package
        run: python -m pip install -e .

      - name: Lint, types, tests, coverage
        shell: bash
        run: bash scripts/check.sh

      - name: CLI smoke test
        shell: bash
        run: |
          tuik-data --version
          tuik-data indicators --json > /dev/null
          tuik-data flatten examples/tufe_example.json --format csv --out smoke.csv
          test -s smoke.csv

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel and decode a fixture
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "import tuik_data; print(tuik_data.__version__)"
          tuik-data flatten "$GITHUB_WORKSPACE/examples/tufe_example.json" --format json > out.json
          test -s out.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
