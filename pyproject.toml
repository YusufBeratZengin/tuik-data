[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuik-data"
version = "0.1.0"
description = "Zero-dependency Python client & CLI for Turkish Statistical Institute (TÜİK) Open Data & SDMX APIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YusufBeratZengin" }]
keywords = [
    "tuik",
    "turkey-statistics",
    "sdmx",
    "json-stat",
    "inflation",
    "cpi",
    "open-data",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
polars = ["polars>=0.20"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/tuik-data"
Documentation = "https://github.com/YusufBeratZengin/tuik-data#readme"
Issues = "https://github.com/YusufBeratZengin/tuik-data/issues"
Changelog = "https://github.com/YusufBeratZengin/tuik-data/blob/main/CHANGELOG.md"

[project.scripts]
tuik-data = "tuik_data.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tuik_data = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
    "network: hits the live TÜİK service; skipped unless TUIK_LIVE=1 is set",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["tuik_data"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH", "TID"]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF001", # ambiguous unicode: Turkish text legitimately uses Turkish letters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["polars.*"]
ignore_missing_imports = true
